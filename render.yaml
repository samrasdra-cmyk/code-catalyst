services:
  - type: web
    name: codecatalyst-web
    env: docker
    dockerfilePath: Dockerfile
    # Docker services use CMD from the Dockerfile; startCommand is ignored for env:docker
    dockerBuildArgs:
      # These REACT_APP_* vars are baked into the React bundle at build time.
      # Replace the URL below with your actual Render service URL.
      - REACT_APP_API_URL=https://code-catalyst-loqv.onrender.com
      - REACT_APP_SOCKET_URL=https://code-catalyst-loqv.onrender.com
      - REACT_APP_BACKEND_URL=https://code-catalyst-loqv.onrender.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: "8000"
      - key: FRONTEND_ORIGIN
        value: "https://code-catalyst-loqv.onrender.com"
    healthCheckPath: /health

  - type: worker
    name: codecatalyst-worker
    env: docker
    dockerfilePath: Dockerfile
    startCommand: python worker/main.py
    envVars:
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: "8000"
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
# CodeCatalyst on Render
#
# Free-tier friendly: backend runs the Python worker inline (no RabbitMQ needed).
# Frontend is a separate static site that talks to the backend API + Socket.IO.
#
# After deploy, optionally set GROQ_API_KEY on the backend service for better AI output.

services:
  # ── Backend API + inline Python worker ────────────────────────────────────
  - type: web
    name: code-catalyst-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: QUEUE_MODE
        value: inline
      - key: ENABLE_RAG_INDEXING
        value: "false"
      - key: PYTHON_BIN
        value: python3
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: code-catalyst-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: GROQ_API_KEY
        sync: false

  # ── React frontend (static site) ────────────────────────────────────────────
  - type: web
    name: code-catalyst-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ── Optional: RabbitMQ + separate worker (paid Render plans) ───────────────
  # Uncomment these three services if you want distributed queue processing.
  #
  # - type: pserv
  #   name: codecatalyst-rabbitmq
  #   env: docker
  #   image: rabbitmq:3-management
  #   envVars:
  #     - key: RABBITMQ_ERLANG_COOKIE
  #       generateValue: true
  #     - key: RABBITMQ_DEFAULT_USER
  #       value: guest
  #     - key: RABBITMQ_DEFAULT_PASS
  #       generateValue: true
  #   disk:
  #     name: rabbitmq-data
  #     mountPath: /var/lib/rabbitmq
  #     sizeGB: 1
  #
  # Then set on backend + worker:
  #   QUEUE_MODE=rabbitmq
  #   RABBITMQ_HOST fromService codecatalyst-rabbitmq property host
  #   RABBITMQ_PORT=5672

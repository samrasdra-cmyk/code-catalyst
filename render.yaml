services:
  - type: web
    name: codecatalyst-web
    env: docker
    dockerfilePath: Dockerfile
    startCommand: node backend/src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      - key: CHROMA_HOST
        value: chromadb
      - key: CHROMA_PORT
        value: "8000"
      - key: FRONTEND_ORIGIN
        value: "https://codecatalyst-web.onrender.com"   # <-- REPLACE with your actual URL after deployment
    healthCheckPath: /health

  - type: worker
    name: codecatalyst-worker
    env: docker
    dockerfilePath: Dockerfile
    startCommand: python worker/main.py
    envVars:
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      - key: CHROMA_HOST
        value: chromadb
      - key: CHROMA_PORT
        value: "8000"
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
      - key: GROQ_MODEL
        value: llama-3.1-70b-versatile
# CodeCatalyst on Render — split services (recommended)
#
# Deploy: connect this repo in Render → New Blueprint → paste this file.
# After deploy, set GROQ_API_KEY on the worker service (Dashboard → Environment).
#
# Services:
#   code-catalyst-frontend  Static React site
#   code-catalyst-backend   Express + Socket.IO API
#   code-catalyst-worker    Python LangGraph worker (background)
#   codecatalyst-rabbitmq   Private RabbitMQ (internal only)

services:
  # ── RabbitMQ (private — not reachable from the public internet) ───────────
  - type: pserv
    name: codecatalyst-rabbitmq
    env: docker
    image: rabbitmq:3-management
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: guest
      - key: RABBITMQ_DEFAULT_PASS
        value: guest

  # ── Backend API + Socket.IO ───────────────────────────────────────────────
  - type: web
    name: code-catalyst-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: code-catalyst-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: RABBITMQ_URL
        value: amqp://guest:guest@codecatalyst-rabbitmq:5672
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status

  # ── Python worker (consumes RabbitMQ jobs) ─────────────────────────────────
  - type: worker
    name: code-catalyst-worker
    runtime: python
    rootDir: .
    buildCommand: pip install -r worker/requirements.txt
    startCommand: python worker/main.py
    envVars:
      - key: RABBITMQ_URL
        value: amqp://guest:guest@codecatalyst-rabbitmq:5672
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      # ChromaDB is optional; worker falls back to in-memory RAG without it
      - key: ENABLE_RAG_INDEXING
        value: "false"
      - key: GROQ_API_KEY
        sync: false

  # ── React frontend (static site) ────────────────────────────────────────────
  - type: web
    name: code-catalyst-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: code-catalyst-backend
          envVarKey: RENDER_EXTERNAL_URL

services:
  - type: web
    name: code-catalyst
    env: docker
    dockerfilePath: Dockerfile
    # Docker services use CMD from the Dockerfile; startCommand is ignored for env:docker
    dockerBuildArgs:
      # These REACT_APP_* vars are baked into the React bundle at build time.
      # Replace the URL below with your actual Render service URL.
      - REACT_APP_API_URL=https://code-catalyst-loqv.onrender.com
      - REACT_APP_SOCKET_URL=https://code-catalyst-loqv.onrender.com
      - REACT_APP_BACKEND_URL=https://code-catalyst-loqv.onrender.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RABBITMQ_URL
        fromSecret: RABBITMQ_URL
      - key: JOB_QUEUE_NAME
        value: codecatalyst_jobs
      - key: STATUS_QUEUE_NAME
        value: codecatalyst_status
      - key: CHROMA_HOST
        value: chromadb
      - key: CHROMA_PORT
        value: "8000"
      - key: FRONTEND_ORIGIN
        value: "https://code-catalyst-loqv.onrender.com"
    healthCheckPath: /health

  - type: web
    name: codecatalyst-rabbitmq
    env: docker
    image: rabbitmq:3-management
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: guest
      - key: RABBITMQ_DEFAULT_PASS
        value: guest
    ports:
      - port: 5672
      - port: 15672

  - type: web
    name: codecatalyst-chromadb
    env: docker
    image: chromadb/chroma:latest
    envVars:
      - key: CHROMA_SERVER_HOST
        value: 0.0.0.0
      - key: CHROMA_SERVER_PORT
        value: "8000"
    ports:
      - port: 8000